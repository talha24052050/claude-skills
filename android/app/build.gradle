plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prizma.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.prizma.game'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Oyun tek dosyadır: depo kökündeki derlenmiş index.html uygulamaya varlık olarak kopyalanır.
def webAssets = layout.buildDirectory.dir('webAssets')
def copyGame = tasks.register('copyGame', Copy) {
    from rootProject.file('../index.html')
    into webAssets
}
android.sourceSets.main.assets.srcDir(copyGame)
